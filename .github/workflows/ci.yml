name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Electron's postinstall normally downloads a matching Electron binary for
  # the target platform; CI only needs the package installed to type-check,
  # lint, test, and build the renderer bundle, so skip that download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the pinned Node version — kept in
          # .nvmrc alongside package.json's "engines" field so CI can't drift
          # from what local development validates against.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src electron tests scripts

      - name: Type-check
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

# NOTE: Electron end-to-end (Playwright) tests are not run in CI yet — they
# need a display server / xvfb on ubuntu-latest and are tracked as a
# follow-up rather than part of this minimal pipeline.
