# ELEC-22: kept as the legacy `com.mdreader.app` id (from before the product
# was renamed to Atlas) deliberately, not by oversight. electron-builder's
# NSIS installer keys upgrade-in-place detection and the Windows registry
# uninstall entry off `appId` — changing it would make every existing install
# look like a brand-new, unrelated product to both the installer and Windows,
# breaking the upgrade path and leaving a stale entry behind. If Atlas ever
# needs a fresh id (e.g. to publish under a new vendor/store identity), that
# is a deliberate migration: ship one release that both uninstalls the old
# `com.mdreader.app` install and installs under the new id, not a silent
# rename here.
appId: com.mdreader.app
productName: Atlas
copyright: Copyright (c) 2026 Atlas

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # P5.1/ELEC-10 — `signAndEditExecutable: false` was disabling BOTH code
  # signing AND resedit-based resource editing (icon, FileDescription,
  # ProductName, CompanyName, LegalCopyright, FileVersion/ProductVersion),
  # confirmed against app-builder-lib's winPackager.js: `signApp()` returns
  # early with no resource edit at all when that flag is false. We have no
  # code-signing certificate (see docs/RELEASE.md), but the exe should still
  # carry correct icon/version metadata — `signExecutable: false` skips only
  # the signing step and leaves resource editing enabled, which is exactly
  # what electron-builder's own deprecation-style log message for this
  # option recommends.
  signExecutable: false
