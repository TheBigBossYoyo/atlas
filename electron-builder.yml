nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  deleteAppDataOnUninstall: false
  shortcutName: Atlas
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: false
  runAfterFinish: true
  artifactName: Atlas-Setup-${version}.${ext}
  uninstallDisplayName: ${productName} ${version}
  # Force update of an existing install (overwrite same install location)
  differentialPackage: false
  # build/installer.nsh defines a !macro preInit that clears the legacy
  # MD Reader InstallLocation registry value and forces $INSTDIR to
  # $PROGRAMFILES64\Atlas so upgrades land in C:\Program Files\Atlas\
  # instead of the inherited C:\Program Files\MD Reader\Atlas\ path.
  include: build/installer.nsh

asar: true
